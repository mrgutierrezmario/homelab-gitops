# Phase 4: AI Lecture Notes in staging — Postgres, MinIO, the app (migrations
# in an initContainer), and a restore Job that seeds the database from the
# newest off-site bundle. Whisper runs on CPU in the pod.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lecture-notes-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/mrgutierrezmario/homelab-gitops.git
      targetRevision: main
      path: charts/lecture-notes
      helm:
        releaseName: lecture-notes
        valueFiles:
          - values-staging.yaml
    # lecture-notes-db, -minio, -app, -rclone — sealed.
    - repoURL: https://github.com/mrgutierrezmario/homelab-gitops.git
      targetRevision: main
      path: secrets/lecture-notes
  destination:
    server: https://kubernetes.default.svc
    namespace: lecture-notes-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Apply only what actually differs. Argo otherwise re-applies every
      # resource on every sync, and the restore Job carries Replace=true —
      # so an image-only update deleted and re-ran the restore, blocking the
      # sync while it went (2026-09-23: Lecture Notes re-downloaded ~3,000
      # audio chunks for a change to a CPU limit). The Job still re-runs when
      # its own definition changes, which is the intent.
      - ApplyOutOfSyncOnly=true
