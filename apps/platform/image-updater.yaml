# Argo CD Image Updater: moves staging to every new image CI pushes to GHCR
# (DESIGN.md §3 "Image updates"). Which tags to follow is set per chart with
# annotations on the staging Applications, from phase 5 on. Until then it
# runs and does nothing.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: image-updater
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 1.3.1
    helm:
      releaseName: image-updater
      valuesObject:
        # Runs in the argocd namespace and reads Applications through the
        # Kubernetes API; no Argo server address to configure.
        config:
          registries:
            - name: GitHub Container Registry
              prefix: ghcr.io
              api_url: https://ghcr.io
              # All three images are public; no pull secret.
              default: true
        resources:
          requests: { cpu: 25m, memory: 64Mi }
          limits: { memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
