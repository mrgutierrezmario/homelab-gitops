# Argo CD sized for a 6 GiB VM, reachable on the tailnet only.
# Used twice: bootstrap/argocd.sh (helm template) and apps/platform/argocd.yaml.

global:
  domain: argocd.tail3659a6.ts.net

configs:
  params:
    # TLS ends at the Tailscale operator; the pod speaks plain HTTP.
    server.insecure: true
    # Render at most two manifests at once. Rendering is what makes the
    # repo-server's memory spike, and a repo-server that gets OOM-killed
    # mid-refresh leaves apps reporting "Synced" at a stale revision
    # (2026-09-23 — that is how phase 5's write-backs sat unapplied).
    reposerver.parallelism.limit: 2
  cm:
    # How often git is polled (default 120s + up to 60s jitter). Public repo,
    # no webhook — 3 min is fine.
    timeout.reconciliation: 180s

# Single admin user is enough for a one-person tailnet. Dex is an SSO
# component; off saves ~100 MB.
dex:
  enabled: false
notifications:
  enabled: false
# The root app is a plain directory, no ApplicationSet needed yet. The chart
# cannot switch the controller off, so it is scaled to zero.
applicationSet:
  replicas: 0

# Limits below are ceilings, not usage: the whole control plane idles at
# well under its requests. They were too tight at first — repo-server 512Mi
# and server 256Mi both OOM-killed within a day (see configs.params above).
server:
  ingress:
    enabled: true
    ingressClassName: tailscale
    # A bare name: the operator makes it argocd.<tailnet>.ts.net with a real
    # cert. No `tailscale.com/funnel` annotation — this stays private.
    hostname: argocd
    path: /
    pathType: Prefix
    tls: true
  # See repoServer below — the same one-second default, the same problem.
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
  livenessProbe:
    timeoutSeconds: 10
    periodSeconds: 30
    failureThreshold: 5
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

repoServer:
  # The chart gives both probes `timeoutSeconds: 1`. The liveness path is
  # `/healthz?full=true`, which makes the repo-server actually exercise its
  # git and helm tooling — more than a second's work on a four-vCPU VM that
  # is also running Whisper, two Postgres instances and MinIO. It failed 16
  # times in 23 hours and was killed 3 of them (2026-09-23), and while it is
  # down or restarting, applications cannot be refreshed: they keep their
  # last known revision and still report `Synced`. That is what made the
  # phase 5 write-backs look ignored.
  #
  # A genuinely hung repo-server still gets restarted — it now takes 2.5
  # minutes of sustained failure rather than 30 seconds of being busy.
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
  livenessProbe:
    timeoutSeconds: 10
    periodSeconds: 30
    failureThreshold: 5
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    # Renders every chart in this repo plus the platform charts; the peak,
    # not the average, is what has to fit.
    limits: { memory: 1Gi }

redis:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 128Mi }
