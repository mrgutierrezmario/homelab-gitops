# Tailscale Kubernetes operator: Ingress class `tailscale`, MagicDNS names and
# certs for everything on the cluster, Funnel where a manifest asks for it.
# Needs Secret `operator-oauth` in namespace `tailscale` (secrets/README.md).
# Wave 1, after sealed-secrets (wave 0): waves between Applications order
# creation only. There is deliberately no health check for Application in
# argocd-cm, so the root app does not wait on children (the operator sits
# Progressing until its secret exists, docs/OPERATIONS.md build step 2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.102.4
      helm:
        releaseName: tailscale-operator
        valuesObject:
          operatorConfig:
            # The operator's own node name on the tailnet.
            hostname: k3s-operator
            logging: info
          # Left empty on purpose: the chart then expects the operator-oauth
          # Secret instead of taking the client secret as a value.
          oauth: {}
    - repoURL: https://github.com/mrgutierrezmario/homelab-gitops.git
      targetRevision: main
      path: secrets/tailscale
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
