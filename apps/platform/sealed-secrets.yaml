# Sealed Secrets controller. Secrets in secrets/ are encrypted to this
# controller's key; back that key up (docs/OPERATIONS.md) — a rebuilt cluster
# without it cannot read a single committed secret.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0
    helm:
      releaseName: sealed-secrets
      valuesObject:
        # kubeseal's default controller name; the namespace is not its
        # default, so kubeseal is always run with --controller-namespace.
        fullnameOverride: sealed-secrets-controller
        resources:
          requests: { cpu: 25m, memory: 64Mi }
          limits: { memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
