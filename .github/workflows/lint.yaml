name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

      - name: shellcheck
        # Warnings and errors fail the build; info/style findings are ignored.
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning

      - name: yamllint
        run: |
          pip install --quiet yamllint==1.35.1
          yamllint --strict .

      - name: launchd plists parse
        # Templates contain __REPO__/__HOME__ placeholders; they must still be valid plist XML.
        run: |
          git ls-files -z '*.plist' | xargs -0 python3 -c '
          import plistlib, sys
          for p in sys.argv[1:]:
              with open(p, "rb") as f:
                  d = plistlib.load(f)
              assert "Label" in d and "ProgramArguments" in d, f"{p}: missing Label/ProgramArguments"
              print("ok", p)'

      - name: python / json syntax
        run: |
          git ls-files -z '*.py' | xargs -0 -r python3 -m py_compile
          git ls-files -z '*.json' | xargs -0 -r -n1 python3 -m json.tool > /dev/null

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: helm lint + render
        # Render with the same layering Argo uses: values.yaml, then values-staging.yaml.
        # Output is kept in rendered/ for kubeconform.
        run: |
          set -euo pipefail
          mkdir -p rendered
          for c in charts/*/; do
            name=$(basename "$c")
            helm lint "$c"
            if [ -f "$c/values-staging.yaml" ]; then
              helm template ci "$c" -f "$c/values-staging.yaml" > "rendered/$name.yaml"
            else
              helm template ci "$c" > "rendered/$name.yaml"
            fi
            echo "rendered $c"
          done

      - name: kubeconform
        # Schema-validate rendered charts and raw manifests. CRDs (Argo Application,
        # SealedSecret, ImageUpdater) resolve from the datree CRDs-catalog; a kind with
        # no schema fails the build rather than being skipped.
        # k3s tracks the stable channel (bootstrap/lima.yaml); bump KUBE_VERSION with it.
        env:
          KUBE_VERSION: 1.34.12
          KUBECONFORM_VERSION: v0.6.7
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          # Not manifests: Helm values files and the Lima VM config.
          mapfile -t files < <(git ls-files 'apps/*.yaml' 'bootstrap/*.yaml' 'platform/*.yaml' 'secrets/*.yaml' \
            | grep -vE '^apps/platform/values/|^bootstrap/lima\.yaml$')
          ./kubeconform -strict -summary -output text \
            -kubernetes-version "$KUBE_VERSION" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/ "${files[@]}"
