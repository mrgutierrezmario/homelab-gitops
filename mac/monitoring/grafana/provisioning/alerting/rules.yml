# Email when a public site stops answering while this Mac is up. UptimeRobot
# still covers the Mac (or its internet) being down, which nothing here can.
apiVersion: 1
groups:
  - orgId: 1
    name: sites
    folder: Alerts
    interval: 1m
    rules:
      - uid: site-down
        title: Site down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: min by (site) (probe_success{job!="snapshots"})
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        for: 5m
        # No probe results at all (blackbox or Prometheus down) is not "fine".
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: "{{ $labels.site }} has not answered for 5 minutes"
          description: >-
            The blackbox probe from the Mac mini is failing. Check that stack's
            `docker compose logs watchdog` first: it restarts tailscale, the
            app and cloudflared on its own and logs what it did.

      - uid: snapshot-gaps
        title: InsiderTrack snapshots missing
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: min(probe_success{job="snapshots"})
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        # "Today" is a gap from midnight until the 07:00 ET snapshot, so only
        # a gap that outlasts that window is real (a failed 07:00 run alerts
        # by ~15:00).
        for: 8h
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: "InsiderTrack has weekdays with no signal snapshot"
          description: >-
            /health reports snapshot_gaps_14d > 0: the daily 07:00 ET snapshot
            job saved nothing. Check `stacks logs insider app` for
            "Snapshotted" / "Could not compute" and the outcome_snapshot job.
            A restart backfills missing days (flagged is_backfilled).

