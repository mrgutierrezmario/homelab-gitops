# Docker Desktop has no IPv6 route, and blackbox prefers IPv6 by default —
# Cloudflare-fronted sites (mgnetsolutions.com) then fail before connecting.
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
  # An endpoint that must refuse an unauthenticated request: a 401 proves the
  # request reached the service (InsiderTrack's MCP server behind Funnel).
  http_401:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [401]
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
  # InsiderTrack's /health with a data check: fails while any recent weekday
  # has no signal snapshot (the daily 07:00 job silently saved nothing
  # 2026-09-30 → 10-05). The alert waits 8 h, because "today" counts as a
  # gap from midnight until that 07:00 run.
  http_snapshot_gaps:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      fail_if_body_matches_regexp: ['"snapshot_gaps_14d":\s*[1-9]']
