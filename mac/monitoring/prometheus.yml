global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  - job_name: containers
    static_configs: [{ targets: ["docker-exporter:9417"] }]

  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"] }]

  # The public sites, probed the way a visitor reaches them: Funnel for the
  # ts.net names, Cloudflare Tunnel for the mgnetsolutions.com ones.
  - job_name: sites
    metrics_path: /probe
    params: { module: [http_2xx] }
    scrape_interval: 60s
    static_configs:
      - targets:
          - https://mgnetsolutions.com/
          - https://mgnts-stock-tracker.tail3659a6.ts.net/health
          - https://insidertrack.mgnetsolutions.com/health
          - https://mgnts-note-app.tail3659a6.ts.net/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        regex: https://([^.]+)\..*
        target_label: site
      # Display name: the consulting site shows as mgnts-site, like the other two.
      - source_labels: [site]
        regex: mgnetsolutions
        target_label: site
        replacement: mgnts-site
      # InsiderTrack's second route (Cloudflare); the Funnel one stays mgnts-stock-tracker.
      - source_labels: [site]
        regex: insidertrack
        target_label: site
        replacement: insidertrack-cloudflare
      - target_label: __address__
        replacement: blackbox:9115

  # InsiderTrack's MCP server through Funnel. Bearer auth, so the probe
  # expects 401: anything else (502, timeout) means the path is broken.
  - job_name: mcp
    metrics_path: /probe
    params: { module: [http_401] }
    scrape_interval: 60s
    static_configs:
      - targets: [https://mgnts-stock-tracker.tail3659a6.ts.net/mcp]
        labels: { site: insidertrack-mcp }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox:9115

  # InsiderTrack data freshness, not uptime: the probe fails while
  # /health reports snapshot gaps. Its own alert rule (snapshot-gaps); the
  # site-down rule and `stacks` leave job="snapshots" out.
  - job_name: snapshots
    metrics_path: /probe
    params: { module: [http_snapshot_gaps] }
    scrape_interval: 5m
    static_configs:
      - targets: [https://mgnts-stock-tracker.tail3659a6.ts.net/health]
        labels: { site: insidertrack-snapshots }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox:9115

  # Sites whose addresses are kept out of this public repo: one file_sd file
  # per site in ./private/ (gitignored), e.g.
  #   - targets: [https://example.com/health]
  #     labels: { site: example-cloudflare }
  - job_name: private-sites
    metrics_path: /probe
    params: { module: [http_2xx] }
    scrape_interval: 60s
    file_sd_configs:
      - files: [/etc/prometheus/private/*.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox:9115
