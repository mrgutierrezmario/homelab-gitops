apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp.name" . }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8100
          env:
            - name: MCP_TRANSPORT
              value: streamable-http
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8100"
            - name: MCP_PATH
              value: {{ .Values.mountPath | quote }}
            - name: INSIDERTRACK_URL
              value: {{ required "insidertrackUrl is required" .Values.insidertrackUrl | quote }}
            - name: MCP_ALLOW_WRITES
              value: {{ ternary "1" "0" .Values.allowWrites | quote }}
            - name: MCP_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tokensSecret }}
                  key: MCP_TOKENS
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Same check the Dockerfile's HEALTHCHECK runs.
          readinessProbe:
            httpGet: { path: {{ include "mcp.healthPath" . }}, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: {{ include "mcp.healthPath" . }}, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
