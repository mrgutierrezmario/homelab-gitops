{{/* The steps, shared by the seed Job and the weekly CronJob. */}}
{{- define "ln.restoreSteps" -}}
- name: fetch
  image: {{ .Values.restore.rcloneImage }}
  command: ["/bin/sh", "/scripts/fetch.sh"]
  resources:
    {{- toYaml $.Values.restore.resources | nindent 4 }}
  env:
    - { name: RCLONE_REMOTE, value: {{ .Values.restore.rcloneRemote | quote }} }
    - { name: RCLONE_CONFIG, value: /config/rclone.conf }
  volumeMounts:
    - { name: scripts, mountPath: /scripts }
    - { name: work, mountPath: /work }
    - { name: rclone, mountPath: /config, readOnly: true }
- name: restore-db
  image: {{ .Values.postgres.image }}
  command: ["/bin/bash", "/scripts/restore-db.sh"]
  resources:
    {{- toYaml $.Values.restore.resources | nindent 4 }}
  env:
    - { name: PGHOST, value: {{ include "ln.postgresName" . }} }
    - { name: PGUSER, value: {{ .Values.postgres.user }} }
    - { name: DB, value: {{ .Values.postgres.database }} }
    - name: PGPASSWORD
      valueFrom:
        secretKeyRef:
          name: {{ .Values.secrets.db }}
          key: POSTGRES_PASSWORD
  volumeMounts:
    - { name: scripts, mountPath: /scripts }
    - { name: work, mountPath: /work }
- name: garage-init
  # The app image, for its Python; Garage's own image has no shell.
  image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
  command: ["python", "/scripts/garage-init.py"]
  resources:
    {{- toYaml $.Values.restore.resources | nindent 4 }}
  env:
    - { name: GARAGE_ADMIN_URL, value: "http://{{ include "ln.garageName" . }}:3903" }
    - { name: BUCKET, value: {{ .Values.garage.bucket }} }
    - { name: GARAGE_CAPACITY_BYTES, value: {{ .Values.garage.capacityBytes | int64 | quote }} }
    - name: GARAGE_ADMIN_TOKEN
      valueFrom: { secretKeyRef: { name: {{ .Values.secrets.garage }}, key: GARAGE_ADMIN_TOKEN } }
    - name: S3_ACCESS_KEY
      valueFrom: { secretKeyRef: { name: {{ .Values.secrets.garage }}, key: S3_ACCESS_KEY } }
    - name: S3_SECRET_KEY
      valueFrom: { secretKeyRef: { name: {{ .Values.secrets.garage }}, key: S3_SECRET_KEY } }
  volumeMounts:
    - { name: scripts, mountPath: /scripts }
{{- if .Values.restore.audio }}
- name: import-audio
  image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
  command: ["/bin/sh", "/scripts/import-audio.sh"]
  resources:
    {{- toYaml $.Values.restore.resources | nindent 4 }}
  env:
    - { name: S3_ENDPOINT_URL, value: "http://{{ include "ln.garageName" . }}:3900" }
    - { name: S3_BUCKET, value: {{ .Values.garage.bucket }} }
    - name: S3_ACCESS_KEY
      valueFrom: { secretKeyRef: { name: {{ .Values.secrets.garage }}, key: S3_ACCESS_KEY } }
    - name: S3_SECRET_KEY
      valueFrom: { secretKeyRef: { name: {{ .Values.secrets.garage }}, key: S3_SECRET_KEY } }
  volumeMounts:
    - { name: scripts, mountPath: /scripts }
    - { name: work, mountPath: /work }
{{- end }}
{{- end }}

{{- define "ln.restoreVolumes" -}}
- name: scripts
  configMap:
    name: {{ include "ln.name" . }}-restore
- name: work
  emptyDir:
    sizeLimit: {{ ternary "8Gi" "2Gi" .Values.restore.audio }}
- name: rclone
  secret:
    secretName: {{ .Values.secrets.rclone }}
{{- end }}

{{- if .Values.restore.enabled }}
# Restoring the newest off-site bundle into staging, two ways from one set of
# steps (docs/restore-drill.md):
#
#   Job      seeds the database, the bucket and (optionally) the audio once,
#            before the app starts (sync wave 1).
#   CronJob  does it again every week and smoke-tests the result.
#
# Steps run as initContainers so they are strictly sequential.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ln.name" . }}-restore
  labels:
    {{- include "ln.labels" . | nindent 4 }}
data:
  fetch.sh: |
    #!/bin/sh
    # Newest daily bundle → /work/bundle.tar.gz (date-named, so lexically last).
    set -eu
    remote="${RCLONE_REMOTE%:}:daily"
    latest=$(rclone lsf "$remote" --files-only | grep -E '^lecture-notes-[0-9]{4}-[0-9]{2}-[0-9]{2}\.tar\.gz$' | sort | tail -1)
    [ -n "$latest" ] || { echo "no bundles under $remote"; exit 1; }
    echo "[restore] fetching $latest"
    rclone copyto "$remote/$latest" /work/bundle.tar.gz --stats-one-line -q
    echo "$latest" > /work/bundle.name
    {{- if .Values.restore.audio }}
    echo "[restore] fetching the audio mirror"
    rclone copy "${RCLONE_REMOTE%:}:audio" /work/audio --transfers 8 --stats-one-line -q
    echo "[restore] audio: $(find /work/audio -type f ! -name MANIFEST | wc -l) chunks"
    {{- end }}
  restore-db.sh: |
    #!/bin/bash
    # Load into <db>_restore, scrub, swap it in under the real name.
    set -euo pipefail
    export PGHOST PGUSER PGPASSWORD
    log() { echo "[restore] $*"; }

    log "bundle: $(cat /work/bundle.name)"
    tar -C /work -xzf /work/bundle.tar.gz
    stage=$(ls -d /work/lecture-notes-*/ | head -1)
    # Production's .env, saved API keys and Tailscale identity: not ours.
    rm -f "$stage/env" "$stage/app-state.tar.gz" "$stage/tailscale-state.tar.gz"
    gzip -dc "$stage/db.sql.gz" | grep -q 'PostgreSQL database dump complete' || { log "dump is incomplete"; exit 1; }

    until pg_isready -q -d postgres; do sleep 2; done
    psql -d postgres -q -v ON_ERROR_STOP=1 \
      -c "DROP DATABASE IF EXISTS ${DB}_restore WITH (FORCE);" \
      -c "CREATE DATABASE ${DB}_restore;"
    log "loading the dump..."
    gzip -dc "$stage/db.sql.gz" | psql -d "${DB}_restore" -q -v ON_ERROR_STOP=1 -o /dev/null
    log "$(psql -d "${DB}_restore" -tAc "select count(*) || ' users, ' || (select count(*) from sessions) || ' lectures, ' || (select count(*) from transcript_segments) || ' transcript segments' from users")"

    log "scrubbing what a copy must not hold"
    psql -d "${DB}_restore" -q -v ON_ERROR_STOP=1 <<SQL
    {{- range .Values.restore.scrubTables }}
    DELETE FROM {{ . }};
    {{- end }}
    SQL

    log "swapping it in"
    for attempt in 1 2 3 4 5; do
      psql -d postgres -q -v ON_ERROR_STOP=1 \
        -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '${DB}' AND pid <> pg_backend_pid();" \
        -c "DROP DATABASE IF EXISTS ${DB}_old WITH (FORCE);" >/dev/null
      if psql -d postgres -q -v ON_ERROR_STOP=1 -c "ALTER DATABASE ${DB} RENAME TO ${DB}_old;"; then break; fi
      [ "$attempt" = 5 ] && { log "could not detach the live database"; exit 1; }
      sleep 2
    done
    psql -d postgres -q -v ON_ERROR_STOP=1 \
      -c "ALTER DATABASE ${DB}_restore RENAME TO ${DB};" \
      -c "DROP DATABASE IF EXISTS ${DB}_old WITH (FORCE);"
    rm -rf "$stage" /work/bundle.tar.gz
    log "database done"
  garage-init.py: |
    # Prepare Garage for the app through its v2 admin API: single-node layout,
    # the app's access key (imported with the ID/secret from the sealed secret),
    # and the bucket, owned by that key. Same steps as production's
    # deploy/garage-init.sh, which uses the CLI; the Garage image has no shell.
    # Idempotent: every step is skipped when already done.
    import json, os, sys, time, urllib.error, urllib.request

    ADMIN = os.environ["GARAGE_ADMIN_URL"].rstrip("/")
    TOKEN = os.environ["GARAGE_ADMIN_TOKEN"]
    KEY_ID = os.environ["S3_ACCESS_KEY"]
    KEY_SECRET = os.environ["S3_SECRET_KEY"]
    BUCKET = os.environ["BUCKET"]
    CAPACITY = int(os.environ.get("GARAGE_CAPACITY_BYTES", 10 * 1000**3))

    def log(msg): print(f"[garage-init] {msg}", flush=True)

    def call(method, path, body=None, ok404=False):
        req = urllib.request.Request(
            ADMIN + path, method=method,
            data=None if body is None else json.dumps(body).encode(),
            headers={"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"})
        try:
            with urllib.request.urlopen(req, timeout=10) as r:
                raw = r.read()
                return json.loads(raw) if raw else {}
        except urllib.error.HTTPError as e:
            if ok404 and e.code in (400, 404):
                return None
            sys.exit(f"[garage-init] {method} {path} -> {e.code}: {e.read().decode()[:300]}")

    # 0. Wait for the admin API.
    for _ in range(60):
        try:
            status = call("GET", "/v2/GetClusterStatus"); break
        except (urllib.error.URLError, ConnectionError, OSError):
            time.sleep(2)
    else:
        sys.exit("[garage-init] admin API never came up")

    # 1. Single-node layout (one zone, one copy).
    layout = call("GET", "/v2/GetClusterLayout")
    if not layout.get("roles"):
        node = status["nodes"][0]["id"]
        call("POST", "/v2/UpdateClusterLayout",
             {"roles": [{"id": node, "zone": "dc1", "capacity": CAPACITY, "tags": []}]})
        call("POST", "/v2/ApplyClusterLayout", {"version": layout["version"] + 1})
        log(f"layout applied (node {node[:16]})")

    # 2. The app's key, imported so its ID/secret match the sealed secret.
    if call("GET", f"/v2/GetKeyInfo?id={KEY_ID}", ok404=True) is None:
        call("POST", "/v2/ImportKey",
             {"accessKeyId": KEY_ID, "secretAccessKey": KEY_SECRET, "name": "lecture-notes"})
        log("key imported")

    # 3. The bucket, owned by that key.
    bucket = call("GET", f"/v2/GetBucketInfo?globalAlias={BUCKET}", ok404=True)
    if bucket is None:
        bucket = call("POST", "/v2/CreateBucket", {"globalAlias": BUCKET})
        log(f"bucket {BUCKET} created")
    call("POST", "/v2/AllowBucketKey",
         {"bucketId": bucket["id"], "accessKeyId": KEY_ID,
          "permissions": {"read": True, "write": True, "owner": True}})
    log(f"ready: bucket {BUCKET}, key {KEY_ID}")
  import-audio.sh: |
    #!/bin/sh
    # deploy/restore.sh does the same: the app's own module uploads the mirror.
    # Stays in the image's WORKDIR (/app/ui_backend) so `-m storage…` resolves.
    set -eu
    [ -d /work/audio ] || { echo "[restore] no audio to import"; exit 0; }
    tar -C /work/audio -cf - . | python -m storage.audio_backup import
    rm -rf /work/audio
    echo "[restore] audio done"
  smoke.sh: |
    #!/bin/sh
    # Weekly drill only: the restore said it worked — now prove the app can
    # serve it. /health reports the database and object storage separately,
    # so both are checked.
    set -eu
    body=""; i=0
    while [ $i -lt 60 ]; do
      body=$(wget -qO- -T 10 "http://$APP_HOST:8000/health" 2>/dev/null) || body=""
      if [ -n "$body" ]; then break; fi
      i=$((i + 1)); sleep 5
    done
    if [ -z "$body" ]; then echo "[drill] app never answered"; exit 1; fi
    for want in '"database":"ok"' '"storage":"ok"'; do
      case "$body" in
        *"$want"*) ;;
        *) echo "[drill] app unhealthy, missing $want: $body"; exit 1 ;;
      esac
    done
    echo "[drill] app ok: $body"
    if [ -n "${PUSH_URL:-}" ]; then
      wget -qO- -T 10 "$PUSH_URL" >/dev/null 2>&1 || echo "[drill] push failed (ignored)"
    fi
    echo "[drill] weekly restore drill passed"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ln.name" . }}-restore
  labels:
    {{- include "ln.labels" . | nindent 4 }}
    app.kubernetes.io/component: restore
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  # One attempt. A failed restore is a bug to read, not a flake to retry —
  # and while a Job retries, the sync that created it blocks every commit
  # that would fix it.
  backoffLimit: 0
  # Fail rather than hang: a Running sync blocks every later commit.
  activeDeadlineSeconds: {{ ternary 3600 1200 .Values.restore.audio }}
  template:
    metadata:
      labels:
        {{- include "ln.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: restore
    spec:
      restartPolicy: Never
      initContainers:
        {{- include "ln.restoreSteps" . | nindent 8 }}
      containers:
        - name: done
          image: busybox:stable
          command: ["sh", "-c", "echo '[restore] done'"]
      volumes:
        {{- include "ln.restoreVolumes" . | nindent 8 }}
{{- if .Values.restore.schedule }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ln.name" . }}-restore-drill
  labels:
    {{- include "ln.labels" . | nindent 4 }}
    app.kubernetes.io/component: restore-drill
spec:
  schedule: {{ .Values.restore.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # Longer than the seed Job's: the weekly run re-fetches the audio
      # mirror from Drive into a fresh emptyDir every time.
      activeDeadlineSeconds: {{ ternary 5400 1800 .Values.restore.audio }}
      template:
        metadata:
          labels:
            {{- include "ln.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: restore-drill
        spec:
          restartPolicy: Never
          initContainers:
            {{- include "ln.restoreSteps" . | nindent 12 }}
          containers:
            - name: smoke
              image: busybox:stable
              command: ["sh", "/scripts/smoke.sh"]
              env:
                - name: APP_HOST
                  value: {{ include "ln.name" . }}
                - name: PUSH_URL
                  value: {{ .Values.restore.pushUrl | quote }}
              volumeMounts:
                - { name: scripts, mountPath: /scripts }
          volumes:
            {{- include "ln.restoreVolumes" . | nindent 12 }}
{{- end }}
{{- end }}
