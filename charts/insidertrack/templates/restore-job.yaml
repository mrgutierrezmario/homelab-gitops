{{/* The steps, shared by the seed Job and the weekly CronJob. */}}
{{- define "it.restoreSteps" -}}
- name: fetch
  image: {{ .Values.restore.rcloneImage }}
  command: ["/bin/sh", "/scripts/fetch.sh"]
  env:
    - name: RCLONE_REMOTE
      value: {{ .Values.restore.rcloneRemote | quote }}
    - name: RCLONE_CONFIG
      value: /config/rclone.conf
  volumeMounts:
    - { name: scripts, mountPath: /scripts }
    - { name: work, mountPath: /work }
    - { name: rclone, mountPath: /config, readOnly: true }
- name: restore-db
  image: {{ .Values.postgres.image }}
  command: ["/bin/bash", "/scripts/restore-db.sh"]
  env:
    - name: PGHOST
      value: {{ include "it.postgresName" . }}
    - name: PGUSER
      value: {{ .Values.postgres.user }}
    - name: DB
      value: {{ .Values.postgres.database }}
    - name: PGPASSWORD
      valueFrom:
        secretKeyRef:
          name: {{ .Values.secrets.db }}
          key: DB_PASSWORD
  volumeMounts:
    - { name: scripts, mountPath: /scripts }
    - { name: work, mountPath: /work }
{{- end }}

{{- define "it.restoreVolumes" -}}
- name: scripts
  configMap:
    name: {{ include "it.name" . }}-restore
- name: work
  emptyDir:
    sizeLimit: 4Gi
- name: rclone
  secret:
    secretName: {{ .Values.secrets.rclone }}
{{- end }}

{{- if .Values.restore.enabled }}
# Restoring the newest off-site bundle into staging, two ways from one set of
# steps (docs/restore-drill.md):
#
#   Job      seeds the database once, before the app starts (sync wave 1).
#   CronJob  does it again every week, then smoke-tests the result — so the
#            data tracks production instead of ageing, and a backup that
#            stopped restoring is noticed without anyone running anything.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "it.name" . }}-restore
  labels:
    {{- include "it.labels" . | nindent 4 }}
data:
  fetch.sh: |
    #!/bin/sh
    # Newest daily bundle → /work/bundle.tar.gz. Bundles are date-named, so
    # the lexically last one is the newest.
    set -eu
    remote="${RCLONE_REMOTE%:}:daily"
    latest=$(rclone lsf "$remote" --files-only | grep -E '^stock-tracker-[0-9]{4}-[0-9]{2}-[0-9]{2}\.tar\.gz$' | sort | tail -1)
    [ -n "$latest" ] || { echo "no bundles under $remote"; exit 1; }
    echo "[restore] fetching $latest"
    rclone copyto "$remote/$latest" /work/bundle.tar.gz --stats-one-line -q
    echo "$latest" > /work/bundle.name
  restore-db.sh: |
    #!/bin/bash
    # Restore into <db>_restore, scrub production-only settings, then swap it
    # in under the real name. The app reconnects to the new database.
    set -euo pipefail
    export PGHOST PGUSER PGPASSWORD
    log() { echo "[restore] $*"; }

    log "bundle: $(cat /work/bundle.name)"
    tar -C /work -xzf /work/bundle.tar.gz
    stage=$(ls -d /work/stock-tracker-*/ | head -1)
    # The bundle also carries production's .env and Tailscale identity. Not
    # ours to use; gone before anything else runs.
    rm -f "$stage/env" "$stage/tailscale-state.tar.gz"
    gzip -dc "$stage/db.sql.gz" | grep -q 'PostgreSQL database dump complete' || { log "dump is incomplete"; exit 1; }

    until pg_isready -q -d postgres; do sleep 2; done
    psql -d postgres -q -v ON_ERROR_STOP=1 \
      -c "DROP DATABASE IF EXISTS ${DB}_restore WITH (FORCE);" \
      -c "CREATE DATABASE ${DB}_restore;"
    log "loading the dump..."
    gzip -dc "$stage/db.sql.gz" | psql -d "${DB}_restore" -q -v ON_ERROR_STOP=1 -o /dev/null
    log "$(psql -d "${DB}_restore" -tAc "select count(*) || ' trades, ' || (select count(*) from politicians) || ' members, ' || (select count(*) from form4_transactions) || ' Form 4 rows' from trades")"

    log "scrubbing production credentials from the copy"
    psql -d "${DB}_restore" -q -v ON_ERROR_STOP=1 <<SQL
    DELETE FROM app_settings WHERE key IN ({{ range $i, $k := .Values.restore.scrubSettings }}{{ if $i }}, {{ end }}'{{ $k }}'{{ end }});
    INSERT INTO app_settings (key, value) VALUES
      ('ai_provider', '{{ .Values.app.aiProvider }}'),
      ('ai_batch_provider', '{{ .Values.app.aiBatchProvider }}'),
      ('ollama_base_url', '{{ .Values.app.ollamaBaseUrl }}')
    ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value, updated_at = now();
    SQL

    log "swapping it in"
    for attempt in 1 2 3 4 5; do
      psql -d postgres -q -v ON_ERROR_STOP=1 \
        -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '${DB}' AND pid <> pg_backend_pid();" \
        -c "DROP DATABASE IF EXISTS ${DB}_old WITH (FORCE);" >/dev/null
      if psql -d postgres -q -v ON_ERROR_STOP=1 -c "ALTER DATABASE ${DB} RENAME TO ${DB}_old;"; then break; fi
      [ "$attempt" = 5 ] && { log "could not detach the live database"; exit 1; }
      sleep 2
    done
    psql -d postgres -q -v ON_ERROR_STOP=1 \
      -c "ALTER DATABASE ${DB}_restore RENAME TO ${DB};" \
      -c "DROP DATABASE IF EXISTS ${DB}_old WITH (FORCE);"
    rm -rf /work/*
    log "done"
  smoke.sh: |
    #!/bin/sh
    # Weekly drill only: the restore said it worked — now prove the stack can
    # actually serve it. A backup that restores into something the app cannot
    # read has not really restored.
    set -eu
    check() {
      name=$1; url=$2; want=$3; body=""; i=0
      while [ $i -lt 30 ]; do
        body=$(wget -qO- -T 10 "$url" 2>/dev/null) || body=""
        if [ -n "$body" ]; then break; fi
        i=$((i + 1)); sleep 5
      done
      if [ -z "$body" ]; then echo "[drill] $name never answered at $url"; exit 1; fi
      case "$body" in
        *"$want"*) echo "[drill] $name ok" ;;
        *) echo "[drill] $name unhealthy: $body"; exit 1 ;;
      esac
    }
    check app "http://$APP_HOST:8003/health" '"db":true'
    check mcp "http://$MCP_HOST:8100/mcp/health" '"status":"ok"'
    # Optional heartbeat for Uptime Kuma (DESIGN.md phase 7). Never fails the
    # drill: the drill's own result is the exit code.
    if [ -n "${PUSH_URL:-}" ]; then
      wget -qO- -T 10 "$PUSH_URL" >/dev/null 2>&1 || echo "[drill] push failed (ignored)"
    fi
    echo "[drill] weekly restore drill passed"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "it.name" . }}-restore
  labels:
    {{- include "it.labels" . | nindent 4 }}
    app.kubernetes.io/component: restore
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  # One attempt. A failed restore is a bug to read, not a flake to retry —
  # and while a Job retries, the sync that created it blocks every commit
  # that would fix it.
  backoffLimit: 0
  # A Job that never starts (a missing Secret, an image that will not pull)
  # must fail rather than hang: a Running sync blocks every later commit,
  # including the one that would fix it (2026-09-21). 20 min covers a
  # slow bundle download on first run.
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        {{- include "it.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: restore
    spec:
      restartPolicy: Never
      initContainers:
        {{- include "it.restoreSteps" . | nindent 8 }}
      containers:
        # The work is done by the steps above; this is the Job's exit code.
        # No smoke check here: the app does not exist yet (it is wave 2).
        - name: done
          image: busybox:stable
          command: ["sh", "-c", "echo '[restore] seeded'"]
      volumes:
        {{- include "it.restoreVolumes" . | nindent 8 }}
{{- if .Values.restore.schedule }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "it.name" . }}-restore-drill
  labels:
    {{- include "it.labels" . | nindent 4 }}
    app.kubernetes.io/component: restore-drill
spec:
  schedule: {{ .Values.restore.schedule | quote }}
  # Never two at once, and never a catch-up storm after the VM was off.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            {{- include "it.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: restore-drill
        spec:
          restartPolicy: Never
          initContainers:
            {{- include "it.restoreSteps" . | nindent 12 }}
          containers:
            - name: smoke
              image: busybox:stable
              command: ["sh", "/scripts/smoke.sh"]
              env:
                - name: APP_HOST
                  value: {{ include "it.name" . }}
                - name: MCP_HOST
                  value: {{ .Values.ingress.mcpService | default "insidertrack-mcp" }}
                - name: PUSH_URL
                  value: {{ .Values.restore.pushUrl | quote }}
              volumeMounts:
                - { name: scripts, mountPath: /scripts }
          volumes:
            {{- include "it.restoreVolumes" . | nindent 12 }}
{{- end }}
{{- end }}
