{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "it.name" . }}
  labels:
    {{- include "it.labels" . | nindent 4 }}
  {{- if .Values.ingress.funnel }}
  annotations:
    tailscale.com/funnel: "true"
  {{- end }}
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- with .Values.ingress.mcpService }}
          # Production's serve.json: / → app, /mcp → mcp. Same here; the
          # operator keeps the prefix, so the MCP mounts at /mcp.
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{ . }}
                port:
                  number: 8100
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "it.name" . }}
                port:
                  number: 8003
{{- end }}
